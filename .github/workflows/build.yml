name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup and Test
        uses: ./.github/actions/setup-and-test

      - name: Upload Test Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: polytray-${{ runner.os }}-test-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package App
        uses: ./.github/actions/package-app

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: polytray-${{ runner.os }}-artifacts
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*-mac.zip
            dist/*.AppImage
            dist/*.blockmap
            latest*.yml
          retention-days: 7
