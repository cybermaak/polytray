name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      restart_repairs:
        description: 'Run only the P01 preview and P02 scan comparison on Windows'
        type: boolean
        default: false

# A newer push to the same PR supersedes its in-flight run; main and dispatch runs always finish.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Windows Product currently takes ~20 minutes; a hang should fail fast, not burn the 6-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event.inputs.restart_repairs == 'true' && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup and Test
        uses: ./.github/actions/setup-and-test
        with:
          test-command: ${{ github.event.inputs.restart_repairs == 'true' && 'npx electron-builder install-app-deps && node tests/dev/restart-windows-probe.mjs' || 'npm run test:product' }}

      - name: Upload Test Failure Evidence
        if: failure() || github.event.inputs.restart_repairs == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: polytray-${{ runner.os }}-test-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package App
        if: github.event.inputs.restart_repairs != 'true'
        uses: ./.github/actions/package-app

      - name: Upload Artifacts
        if: github.event.inputs.restart_repairs != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: polytray-${{ runner.os }}-artifacts
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*-mac.zip
            dist/*.AppImage
            dist/*.blockmap
            latest*.yml
          retention-days: 7
