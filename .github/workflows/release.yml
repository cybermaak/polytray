name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        # macOS is intentionally excluded: signed + notarized mac artifacts are
        # built and published locally via `npm run release:mac`. Building mac in
        # CI would upload adhoc-signed .dmg/.zip that overwrite the signed ones.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup and Test
        uses: ./.github/actions/setup-and-test

      - name: Package App
        uses: ./.github/actions/package-app

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: polytray-${{ runner.os }}-artifacts
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*-mac.zip
            dist/*.AppImage
            dist/*.blockmap
            latest*.yml
          retention-days: 7

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Auto-build release notes from commits/PRs so the release is never
          # empty. Curate further later with `gh release edit` if desired.
          generate_release_notes: true
          # No mac assets here — they are published locally, signed & notarized.
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            latest*.yml
