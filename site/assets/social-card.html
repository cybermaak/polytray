<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: radial-gradient(120% 160% at 8% 0%, #1c2433 0%, #0a0a0f 58%);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: #e8ecf4; display: flex; align-items: center;
  }
  .left { width: 560px; padding: 0 0 0 72px; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
  .brand img { width: 88px; height: 88px; border-radius: 20px; }
  .brand h1 { font-size: 58px; font-weight: 700; letter-spacing: -1px; }
  .tag { font-size: 26px; line-height: 1.45; color: #aab4c6; margin-bottom: 30px; }
  .tag b { color: #e8ecf4; font-weight: 600; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    font-size: 17px; padding: 7px 14px; border-radius: 999px;
    background: #1d2430; color: #9fb0c8; border: 1px solid #2c3648;
  }
  .chip.signed { background: #1d3a2c; color: #9fe0b8; border-color: #2c5a42; }
  .shot {
    position: absolute; right: -120px; top: 70px;
    width: 780px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 0 1px #2c3648;
    transform: rotate(-1.5deg);
  }
  .shot img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <img src="icon.png" alt="">
      <h1>Polytray</h1>
    </div>
    <div class="tag">Local-first organizer for your <b>.stl&nbsp;·&nbsp;.obj&nbsp;·&nbsp;.3mf</b> libraries. Scan, search, and preview — no cloud.</div>
    <div class="chips">
      <span class="chip signed">✓ Signed &amp; notarized for macOS</span>
      <span class="chip">Windows</span>
      <span class="chip">Linux</span>
      <span class="chip">Free &amp; open source</span>
    </div>
  </div>
  <div class="shot"><img src="screenshot.png" alt=""></div>
</body>
</html>
